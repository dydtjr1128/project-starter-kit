name: 결함 보고
description: 오동작이나 회귀를 재현 정보와 함께 등록
body:
  - type: markdown
    attributes:
      value: |
        **작성 요령**
        - **제목**: 대상과 증상을 짧게 표현. 예: `설정 저장 후 언어 선택 초기화`
        - **이슈 번호**: 목록 안의 `#번호`는 GitHub가 제목·상태로 펼쳐 줄이 길어짐. 목록 한 줄에는 번호 하나만 쓰고 여러 번호·관계는 표나 문장으로 작성
        - **흐름도**: 재현·처리 흐름이 복잡할 때만 아래 `흐름도 (선택)`에 Mermaid로 추가. 짧은 흐름은 `입력 → 처리 → 결과`처럼 한 줄이면 충분

  - type: textarea
    id: summary
    attributes:
      label: 요약
      description: 짧은 불릿 2~3개, 명사형·단답형 종결(`~합니다`·`~습니다`·`~한다` 생략). 상세 설명과 로그는 아래에 작성
      placeholder: |
        - 설정 저장 후 언어 선택 초기화
        - 다시 접속할 때마다 언어 재설정 필요
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: 현재 동작 (AS-IS)
      description: 문제가 발생한 입력·상황과 실제 결과. 작은 결함은 1~2문장으로 충분
      placeholder: |
        - 입력·상황:
        - 실제 결과·오류:
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: 기대 동작 (TO-BE)
      description: 같은 입력·상황에서 기대하는 정상 결과. 구현 방법은 적지 않음
      placeholder: |
        - 기대 결과:
    validations:
      required: true

  - type: textarea
    id: flow_diagram
    attributes:
      label: 흐름도 (선택)
      description: 흐름이 복잡할 때만 Mermaid 코드 입력(본문에는 mermaid 코드 블록으로 들어감). 실선은 현재 경로, 점선은 기대 경로. 단순한 결함은 비워 둠
      placeholder: |
        flowchart LR
          A[입력] --> B{검증}
          B -->|현재| C[잘못된 결과]
          B -.->|기대| D[정상 결과]
      render: mermaid

  - type: textarea
    id: reproduction
    attributes:
      label: 재현 방법 또는 증거
      description: 최소 재현 단계와 결과. 재현이 어려우면 관찰 시점·빈도·확인한 증거 기재
      placeholder: |
        1. 실행 환경 또는 입력 준비
        2. 문제가 발생하는 작업 수행
        3. 결과 확인
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 환경
      description: 관련 버전·커밋, 운영체제·브라우저 등. 모르는 항목은 미확인으로 표시
      placeholder: |
        - 버전 또는 커밋:
        - 운영체제·브라우저·런타임:
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: 영향과 참고 자료 (선택)
      description: 영향 범위, 우회 방법, 로그·스크린샷. 비밀키와 개인정보 제거

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건 (선택)
      placeholder: |
        - [ ] 재현 단계에서 기대 동작 확인
        - [ ] 기존 정상 동작 유지

  - type: textarea
    id: relationships
    attributes:
      label: 관련 이슈 (선택)
      description: 중복·선행·후속 등 관계가 있는 이슈. 여러 개면 표로 작성(목록으로 쓰면 번호마다 제목이 펼쳐짐)
      placeholder: |
        | 관계 | 이슈 | 메모 |
        | --- | --- | --- |
        | 선행 | #번호 | 먼저 해결돼야 하는 이유 |
        | 관련 | #번호 | |

  - type: checkboxes
    id: submission_checks
    attributes:
      label: 등록 확인
      options:
        - label: 열린 이슈에서 같은 결함이 없는지 확인
          required: true
        - label: 로그·스크린샷의 비밀키·개인정보 제거 또는 해당 없음
          required: true
