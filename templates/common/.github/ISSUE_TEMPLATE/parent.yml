name: 부모 이슈
description: 여러 자식 이슈로 나누는 큰 작업의 범위·진행 순서·공통 완료 조건 관리
title: "[부모] "
body:
  - type: markdown
    attributes:
      value: |
        **작성 요령**
        - **역할**: 부모는 자체 구현 PR 없이 자식 이슈의 범위·진행 순서·공통 완료 조건만 관리. 하나의 PR로 끝나는 작업은 결함 보고·기능 제안 양식 사용
        - **제목**: `[부모]` 뒤에 공통 목표를 짧게 표현. 예: `[부모] 결제 흐름 개편`
        - **연결**: 자식은 GitHub sub-issue로 연결하고 먼저 끝나야 하는 자식은 blocked-by로 연결. 본문 표는 읽기용 보조 기록
        - **이슈 번호**: 목록 안의 `#번호`는 GitHub가 제목·상태로 펼쳐 줄이 길어짐. 자식 지도와 관계는 표로 작성
        - **흐름도**: 자식 사이 의존이 단계 표만으로 읽기 어려울 때만 아래 `흐름도 (선택)`에 Mermaid로 추가

  - type: textarea
    id: summary
    attributes:
      label: 요약
      description: 전체 문제와 목표를 짧은 불릿 2~3개로. 명사형·단답형 종결(`~합니다`·`~습니다`·`~한다` 생략)
      placeholder: |
        - 결제 단계마다 다른 검증 규칙으로 오류 증가
        - 검증 공통화 후 결제 수단별 자식 작업으로 개편
    validations:
      required: true

  - type: textarea
    id: shared_context
    attributes:
      label: 현재 상태 (AS-IS)와 목표 상태 (TO-BE)
      description: 전체 작업의 현재 문제와 최종 목표를 각각 1~2문장으로. 자식별 재현·구현 상세는 자식 이슈에 작성
      placeholder: |
        - AS-IS: 공통 문제와 영향 범위
        - TO-BE: 모든 자식이 끝난 뒤 기대하는 결과
        - 자식으로 나누는 이유:
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 범위와 제외 범위
      description: 전체 작업의 경계와 유지해야 할 동작
      placeholder: |
        - 포함 범위:
        - 유지할 동작:
        - 제외 범위:
    validations:
      required: true

  - type: textarea
    id: children
    attributes:
      label: 자식 작업과 진행 순서
      description: 자식 지도는 표로 작성(목록으로 쓰면 번호마다 제목이 펼쳐짐). 담당 범위는 한 줄로 쓰고 세부는 자식 이슈에. 같은 단계는 병렬로 진행하고, 선행은 먼저 끝나야 하는 자식. 등록 전에는 작업명으로 적고 등록 후 번호로 교체
      placeholder: |
        | 단계 | 자식 | 담당 범위 | 선행 |
        | :-: | --- | --- | --- |
        | 1 | #번호 또는 작업명 | 맡는 범위 한 줄 | 없음 |
        | 2 | #번호 | 맡는 범위 한 줄 | #번호 |
        | 2 | #번호 | 맡는 범위 한 줄 | #번호 |

        같은 단계는 병렬 진행. 통합 확인: 어느 단계 뒤에 무엇을 확인하는지
    validations:
      required: true

  - type: textarea
    id: flow_diagram
    attributes:
      label: 흐름도 (선택)
      description: 선행 관계가 여러 갈래로 얽혀 단계 표만으로 읽기 어려울 때만 Mermaid 코드 입력(본문에는 mermaid 코드 블록으로 들어감). 노드는 `#번호 작업명`처럼 짧게, 화살표는 선행에서 후행 방향
      placeholder: |
        flowchart LR
          A[기반 작업] --> B[적용 1]
          A --> C[적용 2]
          B --> D[통합 확인]
          C --> D
      render: mermaid

  - type: textarea
    id: acceptance
    attributes:
      label: 공통 완료 조건
      description: 자식 종료와 별개로 전체 목표를 확인할 결과. 부모를 닫기 전 sub-issue 목록에서 모든 자식의 종료 확인
      placeholder: |
        - [ ] 모든 자식 이슈 종료
        - [ ] 전체 목표 동작 확인
        - [ ] 유지할 동작의 회귀 없음
    validations:
      required: true

  - type: checkboxes
    id: submission_checks
    attributes:
      label: 등록 확인
      options:
        - label: 열린 부모(`is:open has:sub-issue` 검색)와 관련 이슈에서 중복 작업이 없는지 확인
          required: true
        - label: 자식 등록 후 sub-issue와 선행(blocked-by) 연결
          required: true
